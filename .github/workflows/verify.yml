name: Verify collection
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python3 scripts/check.py
      - run: python3 -m unittest discover -s tests -v
      - run: node --test plugins/dsh-balance-monitor/core.test.js tests/routes.test.mjs
      - name: Isolated local installation
        run: python3 scripts/collection.py --target "${{ runner.temp }}/dsh-collection-profile" --plugins dsh-restart dsh-balance-monitor --apply --fetch --manager npm
      - name: Check local package archives
        run: |
          npm pack ./plugins/dsh-restart --ignore-scripts --pack-destination "${{ runner.temp }}"
          npm pack ./plugins/dsh-balance-monitor --ignore-scripts --pack-destination "${{ runner.temp }}"
